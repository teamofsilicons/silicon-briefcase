# Installed in the http context. Empty/ambiguous callbacks fail closed.
# Silicon Accounts is the only sign-in flow. Retired IAM tokens are rejected.
map "$arg_code|$arg_error" $briefcase_callback_port {
    default 0;
    ~^[^|]+\|$ 4319;
    ~^\|[^|]+$ 4319;
}
# Only explicit, uniquely named callback fields are accepted. Percent-encoded
# field names and duplicate credential/state fields are rejected before routing.
map $args $briefcase_callback_query_safe {
    default 0;
    ~*(^|&)(code|error)=[^&]*&([^&]*&)*(code|error)= 0;
    ~*(^|&)(code|error|state)=[^&]*&([^&]*&)*\2= 0;
    ~^(code|error|state|error_description)=[^&]*(&(code|error|state|error_description)=[^&]*)*$ 1;
}
server {
    listen 80;
    listen [::]:80;
    server_name briefcase.teamofsilicons.com;
    root /var/www/certbot;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name briefcase.teamofsilicons.com;
    ssl_certificate /etc/letsencrypt/live/briefcase.teamofsilicons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/briefcase.teamofsilicons.com/privkey.pem;
    location = /auth/callback {
        if ($briefcase_callback_query_safe = 0) { return 400; }
        if ($arg_state = "") { return 400; }
        if ($briefcase_callback_port = 0) { return 400; }
        proxy_pass http://127.0.0.1:$briefcase_callback_port;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/api/v1/uploads$ {
        client_max_body_size 5120g;
        client_body_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4319;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/(browser|assets)(/|$) { return 410; }
    location / {
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

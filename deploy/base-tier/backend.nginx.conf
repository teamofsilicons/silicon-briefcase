# Briefcase-only direct EC2 ingress. TLS files are maintained by Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name backend.briefcase.teamofsilicons.com;
    root /var/www/certbot;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backend.briefcase.teamofsilicons.com;
    ssl_certificate /etc/letsencrypt/live/backend.briefcase.teamofsilicons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.briefcase.teamofsilicons.com/privkey.pem;

    # Only raw file routes get the file-size ceiling. JSON and webhooks retain
    # the proxy default and their stricter application-level limits.
    location ~ ^/api/v1/(uploads|obo/files|obo/uploads/[0-9a-fA-F-]+/content)$ {
        client_max_body_size 5120g;
        client_body_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# /etc/systemd/system/silicon-briefcase-web.service.d/upload.conf
# Requires the private host directory to be owned by container UID/GID 65532.
[Service]
ExecStart=
ExecStart=/usr/bin/docker run --name silicon-briefcase-web --network host --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=16m,mode=1777 --volume /var/lib/silicon-briefcase/web-staging:/var/lib/silicon-briefcase/web-staging --env BRIEFCASE_WEB_UPLOAD_DIRECTORY=/var/lib/silicon-briefcase/web-staging --env-file /etc/silicon-briefcase/web.env --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 234951665042.dkr.ecr.us-east-1.amazonaws.com/silicon-briefcase-production:browser-0.2.1

server {
    listen 80;
    listen [::]:80;
    server_name docs.briefcase.teamofsilicons.com;
    root /var/www/certbot;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.briefcase.teamofsilicons.com;
    ssl_certificate /etc/letsencrypt/live/docs.briefcase.teamofsilicons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.briefcase.teamofsilicons.com/privkey.pem;
    root /var/www/briefcase-docs/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=300";
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /openapi.yaml { default_type application/yaml; }
    location / { try_files $uri $uri/ =404; }
}

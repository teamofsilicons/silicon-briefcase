[package]
name = "briefcase-cli"
description = "Command-line client for the Silicon Briefcase file service."
# Silicon Apps is the only distribution channel (`silicon-apps install briefcase`).
publish = false
categories = ["command-line-utilities", "filesystem"]
keywords = ["briefcase", "silicon", "files", "storage", "cli"]
readme = "README.md"
documentation = "https://docs.briefcase.teamofsilicons.com/cli/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "briefcase"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
briefcase-client = { workspace = true, features = ["accounts"] }
clap = { version = "4.5.51", features = ["derive", "env", "wrap_help"] }
fs2 = "0.4.3"
percent-encoding = "2.3.2"
rpassword = "7.4.0"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror.workspace = true
time = { workspace = true, features = ["local-offset", "macros"] }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
url.workspace = true
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
wiremock = "0.6.5"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

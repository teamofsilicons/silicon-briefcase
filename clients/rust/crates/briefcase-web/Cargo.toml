[package]
name = "briefcase-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["multipart"] }
briefcase-client.workspace = true
futures-util = "0.3.31"
fs2 = "0.4.3"
mime = "0.3.17"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tempfile = "3.23.0"
tokio = { workspace = true, features = ["net", "signal", "sync"] }
tower-http = { version = "0.7.0", features = ["fs", "sensitive-headers", "limit"] }
url.workspace = true
uuid.workspace = true

[lints.rust]
unsafe_code = "forbid"

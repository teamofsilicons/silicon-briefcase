[workspace]
members = ["crates/briefcase-client", "crates/briefcase-cli"]
resolver = "3"

# The two crates are published separately, so every shared choice lives here
# and each crate declares only what it actually adds.
[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/teamofsilicons/silicon-briefcase"
homepage = "https://briefcase.teamofsilicons.com"
authors = ["Team of Silicons"]

[workspace.dependencies]
briefcase-client = { version = "0.1.3", path = "crates/briefcase-client" }

reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "multipart", "rustls", "stream"] }
secrecy = { version = "0.10.3", features = ["serde"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[package]
name = "silicon-briefcase"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Proprietary"
publish = false
default-run = "briefcase-api"

[lib]
name = "silicon_briefcase"
path = "src/lib.rs"

[[bin]]
name = "briefcase-api"
path = "src/bin/briefcase_api.rs"

[[bin]]
name = "briefcase-worker"
path = "src/bin/briefcase_worker.rs"

[[bin]]
name = "briefcase-migrate"
path = "src/bin/briefcase_migrate.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
aws-config = { version = "1.11.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-sdk-s3 = "1.144.0"
aws-sdk-sts = "1.110.0"
aws-smithy-types = { version = "1.6.2", features = ["rt-tokio"] }
axum = { version = "0.8.9", features = ["http2", "json", "macros", "matched-path", "multipart"] }
base64 = "0.22.1"
bytes = "1.11.0"
futures = "0.3.31"
garde = { version = "0.23.0", features = ["derive", "url"] }
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
mime = "0.3.17"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tower = { version = "0.5.2", features = ["buffer", "limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.8.0"
serde_yaml = "0.9.34"
tower = { version = "0.5.2", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

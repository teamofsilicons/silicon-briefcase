            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /entries/{entry_id}/self-destruct:
    delete:
      operationId: makeEntryPermanent
      summary: Keep a self-destructing file
      description: Stops the file's self-destruct timer. Only the file's creator, the drive's owner, and the
        custodian of either may; anyone else who can see the file gets 403. A file whose timer is not running is `not_self_destructing`
        (409).
      tags:
      - Entries
      parameters:
      - $ref: '#/components/parameters/EntryId'
      responses:
        '204':
          description: The file is permanent. Repeating the call after success is `not_self_destructing`
            (409) unless it carries the same optional `Idempotency-Key`, which replays the success.
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /entries/{entry_id}/link-access:
    get:
      operationId: readLinkAccess
      summary: Read explicit and inherited anonymous access
      tags:
      - Permissions
      parameters:
      - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAccess'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.1.0
    put:
      operationId: setLinkAccess
      summary: Set anyone-with-link read/download access
      description: Managed by the entry's creator, the drive's owner, and the custodian of either. The top of a drive
        and its apps folders never get a link (422 `protected_folder`); anything inside them can.
      tags:
      - Permissions
      parameters:
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAccess'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAccessUpdate'
      x-operation-version: 1.2.0
  /entries/{entry_id}/logs:
    get:
      operationId: listEntryLogs
      summary: Read 365 days of file/folder logs, newest first
      tags:
      - Permissions
      parameters:
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 2.0.0
  /public/{owner}/{path}:
    get:
      operationId: readPublicEntry
      summary: Read or download a publicly shared file or folder
      description: What anyone with the link may read, at `/public/{owner}/{path}`. The owner is a `c:`/`si:` id or
        the account's uuid; the first segment of an address from before personal drives (`tos` in
        `/public/tos/…`) also works, through the cutover's aliases.
        An id the owner gave up answers `308` with the address under its current id.
      tags:
      - Permissions
      parameters:
      - name: owner
        in: path
        required: true
        description: The drive's owner (`c:`/`si:` id or account uuid), or the first segment of an address from
          before personal drives.
        schema:
          type: string
          maxLength: 80
      - in: path
        name: path
        required: true
        schema:
          type: string
      - in: query
        name: view
        schema:
          type: string
          enum:
          - metadata
          - contents
          - inline
          - attachment
          default: metadata
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PublicEntry'
                - $ref: '#/components/schemas/PublicPage'
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zstd:
              schema:
                type: string
                format: binary
        '308':
          $ref: '#/components/responses/Moved'
        default:
          $ref: '#/components/responses/Error'
      security: []
      x-operation-version: 2.0.0
  /obo/invitations:
    post:
      operationId: inviteOnBehalfOfMember
      summary: Share or link an entry for the account, inside the issuing app's folder
      tags:
      - Permissions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegatedInvite'
      security:
      - proofAuth: []
      x-proof-scope: briefcase.invitations.create
      description: Requires a User verification proof with scope briefcase.invitations.create from an app allowed for it. Ordinary invitation permissions and logical idempotency apply.
      x-operation-version: 3.0.0
  /obo/link-access:
    post:
      operationId: setLinkAccessOnBehalfOfMember
      summary: Share or link an entry for the account, inside the issuing app's folder
      tags:
      - Permissions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAccess'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegatedLinkAccess'
      security:
      - proofAuth: []
      x-proof-scope: briefcase.link_access.update
      description: Requires a User verification proof with scope briefcase.link_access.update from an app allowed for it. Ordinary link-sharing permissions and logical idempotency apply.
      x-operation-version: 3.0.0
components:
  securitySchemes:
    uploadCapability:
      type: apiKey
      in: header
      name: X-Briefcase-Upload-Capability
      description: Narrow private-byte capability issued by an authorized upload reservation
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Silicon Accounts access token issued to Briefcase (EdDSA JWT, `aud` = `briefcase`, `iss` = the
        Silicon Accounts URL), verified locally against the published keys. Sharing changes, deletion, version
        restore, self-destruct keep and storage configuration also confirm the token with Silicon Accounts.
    proofAuth:
      type: http
      scheme: Proof
      description: '`Authorization: Proof sap_…` — a Silicon Accounts User verification proof whose receiving app
        is `briefcase`, issued to an app the operator allows for the route''s scope (`x-proof-scope`,
        `BRIEFCASE_PROOF_ISSUERS`). The request runs as the account the proof speaks for, and what it creates records
        the issuing app. Apps reach only `apps/{issuing app}/` in that account''s own drive, except the first-party
        apps the operator lists (`BRIEFCASE_PROOF_FIRST_PARTY_ISSUERS`), which reach everything the account can
        through these routes.'
  parameters:
    Drive:
      name: drive
      in: query
      schema:
        type: string
        maxLength: 80
      description: The drive to act in, named by its owner's `c:`/`si:` id or account uuid; the caller's own by
        default. In another account's drive the caller reaches only what was shared with it and what it (or a
        Silicon it looks after) created there; a Carbon holds the owner's rights in the drives of the Silicons it
        looks after.
    Silicon:
      name: silicon
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
      description: The Silicon, by `si:` id or uuid
    UploadTenant:
      name: X-Org-ID
      in: header
      required: false
      deprecated: true
      description: Optional, for older clients. When sent, the uuid of the account the reservation belongs to; the
        drive is otherwise found from the reservation. The capability, not this value, authorizes the bytes.
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{3,32}$
    Owner:
      name: owner
      in: path
      required: true
      description: The drive's owner, by `c:`/`si:` id (`c:ada`) or account uuid.
      schema:
        type: string
        maxLength: 80
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the expected resource version
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    ContentsLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Range:
      name: Range
      in: header
      description: Single `bytes=` range. A malformed or multi-range value is ignored and the complete file is returned.
      schema:
        type: string
        pattern: ^bytes=(\d+-\d*|-\d+)$
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileContent:
      description: Complete file bytes
      headers:
        Content-Disposition:
          schema:
            type: string
          description: '`inline` for content reads and `attachment` for downloads, with both the quoted and RFC
            5987 file name'
        Content-Security-Policy:
          schema:
            const: sandbox; default-src 'none'; frame-ancestors 'none'
        X-Content-Type-Options:
          schema:
            const: nosniff
        Cache-Control:
          schema:
            const: private, no-store
        Accept-Ranges:
          schema:
            const: bytes
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    PartialFileContent:
      description: Requested byte range of the file
      headers:
        Content-Range:
          schema:
            type: string
          description: bytes {first}-{last}/{complete size}
        Content-Disposition:
          schema:
            type: string
        Accept-Ranges:
          schema:
            const: bytes
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Moved:
      description: The owner gave up the id the address used; the same address under the owner's current id
      headers:
        Location:
          schema:
            type: string
            format: uri
          description: The API address under the current id, query kept
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Moved'
  schemas:
    AccountSummary:
      type: object
      additionalProperties: false
      required:
      - uuid
      - kind
      properties:
        uuid:
          type: string
          description: Permanent, case-sensitive account identifier
        id:
          type:
          - string
          - 'null'
          description: Current public id, such as c:ada or si:scout (it can change)
        kind:
          type: string
          enum:
          - carbon
          - silicon
        display_name:
          type:
          - string
          - 'null'
        pfp_url:
          type:
          - string
          - 'null'
    Drive:
      type: object
      additionalProperties: false
      required:
      - owner
      - relation
      - root_id
      - permanent_url
      properties:
        owner:
          $ref: '#/components/schemas/AccountSummary'
        relation:
          type: string
          enum:
          - own
          - custodial
          description: '`own` for the caller''s drive; `custodial` for the drive of a Silicon the caller looks after'
        root_id:
          type: string
          format: uuid
          description: The drive's root folder; list its contents with `GET /entries?parent_id=`
        permanent_url:
          type: string
          format: uri
    DriveList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Drive'
    SharedEntry:
      type: object
      additionalProperties: false
      required:
      - owner
      - shared_at
      - entry
      properties:
        owner:
          $ref: '#/components/schemas/AccountSummary'
        shared_at:
          type: string
          format: date-time
          description: When the newest live share on the entry was made
        entry:
          $ref: '#/components/schemas/Entry'
    SharedPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SharedEntry'
        next_cursor:
          type:
          - string
          - 'null'
    AllowedAccounts:
      type: object
      additionalProperties: false
      required:
      - silicon
      - items
      properties:
        silicon:
          $ref: '#/components/schemas/AccountSummary'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - account
            - allowed_at
            properties:
              account:
                $ref: '#/components/schemas/AccountSummary'
              allowed_at:
                type: string
                format: date-time
    AccountsInfo:
      type: object
      additionalProperties: false
      required:
      - app_id
      - accounts_url
      - delegated_scopes
      properties:
        app_id:
          type: string
          description: Briefcase's app id at Silicon Accounts (the audience of its access tokens)
        accounts_url:
          type: string
          format: uri
          description: The Silicon Accounts URL, which is also the issuer of the access tokens
        delegated_scopes:
          type: array
          description: Scopes another app may hold in a User verification proof to act for an account here
          items:
            type: string
    Account:
      type: object
      additionalProperties: false
      required:
      - uuid
      - kind
      properties:
        uuid:
          type: string
          description: Permanent, case-sensitive account identifier
        id:
          type:
          - string
          - 'null'
          description: Current public id, such as c:ada or si:scout (it can change)
        kind:
          type: string
          enum:
          - carbon
          - silicon
        display_name:
          type:
          - string
          - 'null'
        pfp_url:
          type:
          - string
          - 'null'
        custodian:
          description: A Silicon's custodian (a Carbon); null for Carbons
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - uuid
            properties:
              uuid:
                type: string
              id:
                type:
                - string
                - 'null'
    DelegatedReserveUpload:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - parent_path
      - name
      - content_type
      - size
      - sha256
      properties:
        operation_id:
          type: string
          format: uuid
          description: Stable non-nil logical upload UUID
        parent_path:
          type: string
          maxLength: 2048
          description: Existing folder path; empty selects the private app folder
        name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 0
          maximum: 5497558138880
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Full raw-file digest
    DelegatedCommitUpload:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - upload_id
      properties:
        operation_id:
          type: string
          format: uuid
        upload_id:
          type: string
          format: uuid
    DelegatedUploadQuery:
      type: object
      additionalProperties: false
      required:
      - operation_id
      properties:
        operation_id:
          type: string
          format: uuid
    DelegatedUploadStatus:
      type: object
      required:
      - operation_id
      - upload_id
      - state
      - expires_at
      - published_entry_id
      properties:
        operation_id:
          type: string
          format: uuid
        upload_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - reserved
          - receiving
          - staged
          - committed
          - cancelled
          - expired
          - cleanup_pending
        expires_at:
          type: string
          format: date-time
          description: Absolute reservation deadline; retries do not extend it
        published_entry_id:
          type:
          - string
          - 'null'
          format: uuid
    DelegatedUploadReservation:
      allOf:
      - $ref: '#/components/schemas/DelegatedUploadStatus'
      - type: object
        required:
        - capability
        properties:
          capability:
            type:
            - string
            - 'null'
            format: password
            description: Fresh private-byte staging capability; never log it or use it for publication
    DelegatedOperationId:
      type: string
      format: uuid
      not:
        const: 00000000-0000-0000-0000-000000000000
      description: Stable non-nil logical mutation UUID, reused with unchanged inputs and a valid OBO token after an
        uncertain response
    DelegatedCreateFolder:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - parent_path
      - name
      properties:
        operation_id:
          $ref: '#/components/schemas/DelegatedOperationId'
        parent_path:
          type: string
          description: Existing parent path; the empty string selects the private application folder
        name:
          type: string
          minLength: 1
          description: One valid child folder name
    DelegatedListEntries:
      type: object
      additionalProperties: false
      not:
        required:
        - parent_id
        - path
        properties:
          parent_id:
            type: string
          path:
            type: string
      properties:
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        path:
          type:
          - string
          - 'null'
          minLength: 1
          description: Alternative parent path; must not be blank
        drive:
          type:
          - string
          - 'null'
          maxLength: 80
          description: First-party apps only. The drive to list or resolve `path` in, by its owner's `c:`/`si:` id
            or uuid; the account's own by default. Ignored with `parent_id`.
        filter:
          type:
          - string
          - 'null'
          minLength: 1
          description: Ordinary permission-filtered entry expression
        cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
        limit:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 100
          default: 100
    DelegatedReadFile:
      type: object
      additionalProperties: false
      required:
      - entry_id
      properties:
        entry_id:
          type: string
          format: uuid
        range:
          type:
          - string
          - 'null'
          description: Single bytes= range; malformed or multi-range syntax falls back to the complete file just
            as ordinary reads do
        download:
          type: boolean
          default: false
    DelegatedTrashEntry:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - entry_id
      properties:
        operation_id:
          $ref: '#/components/schemas/DelegatedOperationId'
        entry_id:
          type: string
          format: uuid
    ActorRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - carbon
          - silicon
          - application
        id:
          type: string
    FolderCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        parent_path:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: Destination folder path within the drive, as an alternative to parent_id
        drive:
          type:
          - string
          - 'null'
          maxLength: 80
          description: The drive for parent_path or the top-level folder (its owner's `c:`/`si:` id or uuid); refused with
            parent_id
        root_type:
          type: string
          enum:
          - public
          - private
          - tag
          deprecated: true
          description: Accepted for compatibility with `private` only; every drive is private. `public` and `tag` are
            refused.
        tag:
          type: string
          deprecated: true
          description: Retired; tags no longer exist (refused with tags_retired)
        invitees:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrantCreate'
    ApiVersionDocument:
      type: object
      required:
      - service
      - selected_api_version
      - supported_api_versions
      - contract_version
      - build
      - operations
      properties:
        service:
          type: string
          const: silicon-briefcase
        selected_api_version:
          type: string
          examples:
          - v1
        supported_api_versions:
          type: array
          items:
            type: string
          description: Served majors, newest first
        contract_version:
          type: string
          description: Version of this document
        build:
          type: string
          description: Running backend package version
        operations:
          type: array
          items:
            type: object
            required:
            - id
            - version
            - method
            - path
            properties:
              id:
                type: string
                description: operationId from this document
              version:
                type: string
                description: Revision of the request and response shape
              method:
                type: string
              path:
                type: string
                description: Path below the versioned API base
    OrganizationUsage:
      type: object
      required:
      - storage
      - daily_uploads
      properties:
        storage:
          $ref: '#/components/schemas/UsageMeasure'
        daily_uploads:
          allOf:
          - $ref: '#/components/schemas/UsageMeasure'
          - type: object
            required:
            - resets_at
            properties:
              resets_at:
                type: string
                format: date-time
                description: The next midnight UTC, when the day's allowance returns
    UsageMeasure:
      type: object
      required:
      - used_bytes
      - limit_bytes
      - remaining_bytes
      properties:
        used_bytes:
          type: integer
          format: int64
          minimum: 0
        limit_bytes:
          type: integer
          format: int64
          minimum: 0
        remaining_bytes:
          type: integer
          format: int64
          minimum: 0
    Entry:
      type: object
      required:
      - id
      - org_id
      - type
      - visibility
      - name
      - path
      - permanent_url
      - effective_access
      description: 'A `traversal` entry is a folder the caller reaches only because something inside it was shared.
        It can be opened and lists what was shared; its owner, timestamps, and effective access are withheld. The
        reserved Public, Private, and tag containers carry no `owner`: they are structure Briefcase reconciliation maintains
        rather than any member''s property.'
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        type:
          type: string
          enum:
          - file
          - folder
        visibility:
          type: string
          enum:
          - full
          - traversal
        name:
          type: string
        path:
          type: string
          maxLength: 2048
          description: Organization-relative path without a leading separator
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        root_type:
          type: string
          enum:
          - public
          - private
          - tag
        tag:
          type:
          - string
          - 'null'
        content_type:
          type:
          - string
          - 'null'
        size:
          type:
          - integer
          - 'null'
          minimum: 0
        render:
          description: Renderer a client should open for a file; `unsupported` means metadata and CRUD only.
          oneOf:
          - type: 'null'
          - type: string
            enum:
            - image
            - video
            - document
            - spreadsheet
            - presentation
            - audio
            - archive
            - code
            - unsupported
        permanent_url:
          type: string
          format: uri
          description: Clean permanent URL that shows the folder structure below the drive owner's current id, such as
            https://briefcase.teamofsilicons.com/c:ada/notes/plan.md
        content_url:
          type:
          - string
          - 'null'
          format: uri
          description: Authenticated sandboxed content URL for a file
        download_url:
          type:
          - string
          - 'null'
          format: uri
          description: Authenticated attachment URL for a file
        owner:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ActorRef'
        origin_app_id:
          type:
          - string
          - 'null'
        effective_access:
          type: array
          items:
            type: string
            enum:
            - read
            - write
            - update
            - delete
            - manage_permissions
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        self_destruct_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When this self-destructing file is permanently deleted; null for a permanent file and for
            every folder.
    EntryPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        next_cursor:
          type:
          - string
          - 'null'
    AccessRight:
      type: string
      description: One independent right. `update` never implies `delete`, `write` never implies `update`, and every
        set implicitly includes `read`.
      enum:
      - read
      - write
      - update
      - delete
    AccessRights:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/components/schemas/AccessRight'
    PermissionInspection:
      type: object
      description: Names at least one and at most 100 targets in total.
      properties:
        entry_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        paths:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 2048
        drive:
          type: string
          maxLength: 80
          description: The drive the paths are in (its owner's `c:`/`si:` id or uuid); the caller's own by default
    EffectivePermission:
      type: object
      required:
      - entry_id
      - path
      - type
      - effective_access
      properties:
        entry_id:
          type: string
          format: uuid
        path:
          type: string
        type:
          type: string
          enum:
          - file
          - folder
        effective_access:
          type: array
          items:
            type: string
            enum:
            - read
            - write
            - update
            - delete
            - manage_permissions
    PermissionInspectionResult:
      type: object
      required:
      - items
      - unresolved_entry_ids
      - unresolved_paths
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePermission'
        unresolved_entry_ids:
          type: array
          items:
            type: string
            format: uuid
        unresolved_paths:
          type: array
          items:
            type: string
    PermissionGrantCreate:
      type: object
      required:
      - principal
      - access
      properties:
        principal:
          $ref: '#/components/schemas/ActorRef'
        access:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - read
            - write
            - update
        inherit:
          type: boolean
          default: true
        expires_in_minutes:
          $ref: '#/components/schemas/LifetimeMinutes'
    PermissionGrant:
      allOf:
      - $ref: '#/components/schemas/PermissionGrantCreate'
      - type: object
        required:
        - id
        - granted_by
        - created_at
        - expires_at
        properties:
          id:
            type: string
            format: uuid
          granted_by:
            $ref: '#/components/schemas/ActorRef'
          created_at:
            type: string
            format: date-time
          expires_at:
            type:
            - string
            - 'null'
            format: date-time
            description: When this expiring share ends; null for a permanent grant.
    ActivityEvent:
      type: object
      required:
      - action
      - actor
      - occurred_at
      properties:
        action:
          type: string
          description: Stable versioned action name, for example entry.downloaded.v1
        actor:
          $ref: '#/components/schemas/ActorRef'
        app_id:
          type:
          - string
          - 'null'
          description: Application that acted on the actor's behalf
        occurred_at:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActivityEvent'
    NotificationSubject:
      type: object
      required:
      - entry_id
      - name
      - path
      - type
      - permanent_url
      description: The entry as it was when the notification was created.
      properties:
        entry_id:
          type: string
          format: uuid
        drive:
          type: string
          description: The drive holding the entry (its owner's account uuid); absent on notifications from before
            personal drives
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum:
          - file
          - folder
        permanent_url:
          type: string
          format: uri
    Moved:
      type: object
      required:
      - moved_to
      - permanent_url
      - owner
      properties:
        moved_to:
          type: string
          format: uri
          description: The same API address under the owner's current id
        permanent_url:
          type: string
          format: uri
          description: The matching permanent address on the application host
        owner:
          type: object
          required:
          - uuid
          - id
          properties:
            uuid:
              type: string
            id:
              type: string
    ArchiveListing:
      type: object
      required:
      - format
      - entries
      - truncated
      properties:
        format:
          type: string
          enum:
          - zip
          - tar
          - tar.gz
          - tar.zst
          - 7z
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveItem'
        truncated:
          type: boolean
          description: Whether the archive holds more than is listed
        truncated_because:
          type: string
          enum:
          - entry_limit
          - directory_limit
          - read_limit
          - unreadable_rest
    ArchiveItem:
      type: object
      required:
      - path
      - type
      - size
      properties:
        path:
          type: string
          description: The entry's path inside the archive, as the archive spells it
        type:
          type: string
          enum:
          - file
          - folder
          - link
          - other
        size:
          type: integer
          minimum: 0
          description: Bytes once extracted
        compressed_size:
          type: integer
          minimum: 0
          description: Bytes inside the archive (zip only)
        modified_at:
          type: string
          format: date-time
        encrypted:
          type: boolean
          description: Present and true when the entry's content is encrypted
    Notification:
      type: object
      required:
      - id
      - kind
      - read
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - access_granted
          - access_revoked
          - access_requested
          - access_request_decided
        read:
          type: boolean
        actor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ActorRef'
        subject:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NotificationSubject'
        access:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AccessRights'
        access_request_id:
          type:
          - string
          - 'null'
          format: uuid
        decision:
          type:
          - string
          - 'null'
          enum:
          - approved
          - denied
          - null
        created_at:
          type: string
          format: date-time
    NotificationInbox:
      type: object
      required:
      - items
      - unread_count
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Notification'
        unread_count:
          type: integer
          minimum: 0
    SearchResult:
      type: object
      required:
      - entry
      - score
      - filename_match
      - content_hits
      properties:
        entry:
          $ref: '#/components/schemas/Entry'
        score:
          type: number
        filename_match:
          type: boolean
        content_hits:
          type: integer
          minimum: 0
        snippets:
          type: array
          items:
            type: string
    FileVersion:
      type: object
      required:
      - id
      - number
      - size
      - created_by
      - created_at
      - sha256
      - source
      properties:
        id:
          type: string
        number:
          type: integer
          minimum: 1
        size:
          type: integer
        created_by:
          $ref: '#/components/schemas/ActorRef'
        created_at:
          type: string
          format: date-time
        sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        source:
          type: string
          enum:
          - initial_upload
          - upload
          - restore
    BucketConfiguration:
      type: object
      required:
      - bucket_name
      - region
      - role_arn
      - prefix
      - aws_account_id
      - encryption_mode
      properties:
        drive:
          type: string
          maxLength: 80
          description: The drive to configure (its owner's `c:`/`si:` id or uuid); the caller's own by default
        bucket_name:
          type: string
        region:
          type: string
        role_arn:
          type: string
        prefix:
          type: string
        aws_account_id:
          type: string
        encryption_mode:
          type: string
          enum:
          - sse_s3
          - sse_kms
        kms_key_arn:
          type: string
    BucketConfigurationStatus:
      type: object
      required:
      - status
      - tested_at
      properties:
        status:
          type: string
          enum:
          - configured
          - failed
        tested_at:
          type: string
          format: date-time
        failure_reason:
          type:
          - string
          - 'null'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    FileVersionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
        next_cursor:
          type:
          - string
          - 'null'
    InvitationRecipient:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - carbon
          - silicon
          - email
          - tag
        id:
          type: string
          minLength: 1
          maxLength: 254
    InvitationCreate:
      type: object
      additionalProperties: false
      required:
      - principal
      properties:
        principal:
          $ref: '#/components/schemas/InvitationRecipient'
        access:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - read
            - write
            - update
          default:
          - read
        inherit:
          type: boolean
          default: true
        expires_in_minutes:
          $ref: '#/components/schemas/LifetimeMinutes'
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - principal
      - access
      - inherit
      properties:
        id:
          type: string
          format: uuid
        principal:
          $ref: '#/components/schemas/InvitationRecipient'
        access:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - read
            - write
            - update
          default:
          - read
        inherit:
          type: boolean
          default: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When this expiring share ends; null for a permanent grant. Expired shares are never listed.
    InvitationPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor:
          type:
          - string
          - 'null'
          format: uuid
    LinkAccess:
      type: object
      additionalProperties: false
      required:
      - enabled
      - effective
      - inherited_from
      - can_manage
      - url
      properties:
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Shareable file or folder website URL when effective is true; otherwise null.
        enabled:
          type: boolean
        effective:
          type: boolean
        inherited_from:
          type:
          - string
          - 'null'
          format: uuid
        can_manage:
          type: boolean
          description: Whether this caller can change the explicit link policy; includes safe public/tag system
            roots for organization administrators.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When this entry's own expiring link ends; null for a permanent link or when its own setting is
            off. An expiring link stops working the instant it expires.
    LinkAccessUpdate:
      type: object
      additionalProperties: false
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        expires_in_minutes:
          $ref: '#/components/schemas/LifetimeMinutes'
          description: With `enabled` true, makes this an expiring link that ends after this many minutes; sending it
            again on a live expiring link restarts the clock, and omitting it makes the link permanent. A permanent
            link that is already on is never shortened (`link_already_permanent`, 409).
    LogEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actor_type
      - actor_id
      - app_id
      - action
      - metadata
      - occurred_at
      properties:
        id:
          type: string
          format: uuid
        actor_type:
          type: string
        actor_id:
          type: string
        app_id:
          type:
          - string
          - 'null'
        action:
          type: string
        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
    LogPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEvent'
        next_cursor:
          type:
          - string
          - 'null'
    PublicEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - path
      - entry_type
      - content_type
      - size
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
        entry_type:
          type: string
          enum:
          - file
          - folder
        content_type:
          type:
          - string
          - 'null'
        size:
          type:
          - integer
          - 'null'
          minimum: 0
    PublicPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicEntry'
        next_cursor:
          type:
          - string
          - 'null'
    DelegatedInvite:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - entry_id
      - invitation
      properties:
        operation_id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        invitation:
          $ref: '#/components/schemas/InvitationCreate'
    DelegatedLinkAccess:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - entry_id
      - enabled
      properties:
        operation_id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        expires_in_minutes:
          $ref: '#/components/schemas/LifetimeMinutes'
    LifetimeMinutes:
      type: integer
      minimum: 1
      maximum: 43200
      description: A lifetime from 1 minute to 30 days, in whole minutes. Makes a share a read-only expiring share, or
        a new file self-destructing.
    ExpiringShareChange:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        expires_in_minutes:
          $ref: '#/components/schemas/LifetimeMinutes'
        permanent:
          type: boolean
          const: true
externalDocs:
  url: https://docs.briefcase.teamofsilicons.com/
  description: Official Briefcase documentation

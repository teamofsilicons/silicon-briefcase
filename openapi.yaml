openapi: 3.1.0
info:
  title: Silicon Briefcase API
  version: 4.0.0
  description: File storage for Carbons and Silicons signed in with Silicon Accounts, with permissions, previews,
    search, versioning, recovery, and access for other apps through User verification proofs.
servers:
- url: https://backend.briefcase.teamofsilicons.com/api/v1
  description: The API is served by the backend host. Permanent entry URLs are minted on the application host instead
    as https://briefcase.teamofsilicons.com/{owner}/{path}, where the owner is the drive owner's current `c:`/`si:` id
    (for example `/c:ada/notes/plan.md`); `GET /paths/{owner}/{path}` resolves them. Addresses from before personal
    drives (`/org/{org}/{path}`) keep resolving.
security:
- bearerAuth: []
tags:
- name: Authentication
- name: Drives
- name: Entries
- name: Applications
- name: Uploads
- name: Permissions
- name: Notifications
- name: Search
- name: Versions
- name: Bin
- name: Storage
paths:
  /version:
    get:
      tags:
      - Storage
      operationId: readApiVersion
      summary: Report the API version and per-operation contract revisions
      security: []
      description: 'The compatibility document a client reads before its first real call. It names the API majors
        this build serves, the one selected for the caller, and every operation with the revision of its request
        and response shape.


        A client advertises the majors it supports, newest first, in `Briefcase-Supported-API-Versions`. The server
        answers with the newest both sides support in `Briefcase-API-Version`, and `406` when there is none. `Vary`
        names the request header, so a cache never serves one client''s selection to another.


        An operation''s `version` changes whenever its request or response shape changes observably; adding an operation
        leaves the others alone. A client that verifies its own operations against this list fails at startup rather
        than at the first call that no longer means what it did.


        Also served unversioned at `/api/version`, so a client can negotiate before it knows which base path to
        use.'
      parameters:
      - name: Briefcase-Supported-API-Versions
        in: header
        required: false
        schema:
          type: string
        description: API majors the client supports, newest first, comma separated
      responses:
        '200':
          description: Compatibility document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionDocument'
        '406':
          description: The client supports no API version this build serves
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /accounts:
    get:
      tags:
      - Authentication
      operationId: readAccountsInfo
      summary: Describe how to sign in to Briefcase with Silicon Accounts
      security: []
      description: Public, so a client can find Briefcase's app id and the Silicon Accounts origin before it holds a
        token. Carbons sign in at Silicon Accounts (hosted pages for the web, the device flow for the CLI); Silicons
        exchange a short-lived token from `silicon-accounts login --app briefcase`. Either way Briefcase receives a
        Silicon Accounts access token whose audience is `briefcase`. The response also lists the scopes another app
        can hold in a User verification proof to act for an account here.
      responses:
        '200':
          description: Sign-in facts (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsInfo'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /me:
    get:
      tags:
      - Authentication
      operationId: readAccount
      summary: Read the signed-in Carbon or Silicon as Briefcase knows it
      description: Verifies the access token and returns the account's uuid (the permanent key), its current public
        id, kind, display name and photo, and a Silicon's custodian. A token issued before the account signed out,
        removed Briefcase's access or was deleted answers 401 with the exact reason.
      responses:
        '200':
          description: The signed-in account (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /drives:
    get:
      tags:
      - Drives
      operationId: listDrives
      summary: List the drives the caller opens with the owner's rights
      description: Every Carbon and Silicon has one drive. The list holds the caller's own drive and, for a Carbon,
        the drive of every Silicon it looks after, where it holds the owner's rights (it never acts as the Silicon).
        Each item names the owner, how the caller relates to it (`own` or `custodial`), the drive's root folder and
        its permanent URL. What others shared with the caller is listed by `GET /shared`.
      responses:
        '200':
          description: The caller's drives (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveList'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /shared:
    get:
      tags:
      - Drives
      operationId: listSharedWithMe
      summary: List what other accounts shared with the caller
      description: Newest share first, one item per shared entry, each with the account whose drive holds it so a
        client can group by owner. Only live shares on entries the caller can still see are listed. A shared entry
        opens by its id like any other.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/ContentsLimit'
      responses:
        '200':
          description: Entries shared with the caller (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedPage'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /silicons/{silicon}/allowed-accounts:
    parameters:
    - $ref: '#/components/parameters/Silicon'
    get:
      tags:
      - Drives
      operationId: listSiliconAllowedAccounts
      summary: List who may share with a Silicon besides its custodian and the custodian's other Silicons
      description: A Silicon acts on what it receives, so it accepts shares only from its custodian, the other
        Silicons its custodian looks after, and the accounts listed here. Only the Silicon itself and its custodian
        may read the list (403 `not_silicons_custodian`); naming a Carbon is 422 `not_a_silicon`.
      responses:
        '200':
          description: The accounts allowed to share with the Silicon, oldest first (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedAccounts'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /silicons/{silicon}/allowed-accounts/{account}:
    parameters:
    - $ref: '#/components/parameters/Silicon'
    - name: account
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
      description: The account, by `c:`/`si:` id or uuid
    put:
      tags:
      - Drives
      operationId: allowAccountToShareWithSilicon
      summary: Let an account share with a Silicon
      description: Only the Silicon itself or its custodian may allow (403 `not_silicons_custodian`). Allowing the
        Silicon itself is 422 `allowance_self`.
      responses:
        '201':
          description: The account may now share with the Silicon
        '204':
          description: The account was already allowed; nothing changed
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
    delete:
      tags:
      - Drives
      operationId: disallowAccountToShareWithSilicon
      summary: Stop letting an account share with a Silicon
      description: Shares the account already made stay; the Silicon or its custodian can revoke them one by one.
        404 when the account was not allowed.
      responses:
        '204':
          description: The account may no longer share with the Silicon
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /entries:
    get:
      tags:
      - Entries
      operationId: listEntries
      summary: List folder contents, the top of a drive, or a filtered view of a drive
      description: 'Returns the hundred most recently changed visible entries per page, newest first. Every Carbon
        and Silicon has one drive; `drive` names which (its owner''s `c:`/`si:` id or uuid), defaulting to the
        caller''s own, and is ignored with `parent_id` because a folder names its drive. Without `filter`, the listing
        browses one level: the top of the drive, or the contents of `parent_id`/`path`. With `filter` and no parent,
        it searches every entry in the drive the caller may reach, which is how a `location:` predicate selects a
        subtree. In another account''s drive the caller sees only what was shared with it and what it (or a Silicon
        it looks after) created there.


        The filter language combines freely. Terms are ANDed; `or` introduces an alternative; `not` or a leading
        `-` negates; parentheses group. Supported keys:


        `last:N` / `first:N` take N entries chronologically (1-100, single page); `sort:newest` / `sort:oldest`
        order the result, newest first by default; `between:DD-MM-YYYY=DD-MM-YYYY` bounds the last change with both
        days inclusive; `after:DD-MM-YYYY` and `before:DD-MM-YYYY` bound one side; `from:@c:ada` matches the creator;
        `to:@si:scout` matches an explicit share; `for:@c:ada` matches what that account can reach (ids are resolved
        at Silicon Accounts to the account they name now; an unknown id is 422 `unknown_account`); `contains:''term''`
        matches names and extracted content, with `*` as a wildcard; `has:''term''` matches extracted content only;
        `name:''term''` matches names only; `location:''notes/2026''` matches a path prefix; `is:` takes `file`,
        `folder`, a renderer (`image`, `video`, `document`, `spreadsheet`, `presentation`, `audio`, `archive`, `code`,
        `unsupported`), or an extension such as `md`; `permissions:` takes `read`, `write`, `update`, `delete`,
        or `manage_permissions` and matches the caller''s effective access. A bare word is shorthand for `contains:`.


        Filtering only ever returns entries the caller can already see.'
      parameters:
      - name: parent_id
        in: query
        schema:
          type: string
          format: uuid
        description: Omit for the top of the drive
      - name: path
        in: query
        schema:
          type: string
          maxLength: 2048
        description: Parent folder addressed by its path within the drive instead of identifier
      - $ref: '#/components/parameters/Drive'
      - name: filter
        in: query
        schema:
          type: string
          maxLength: 1024
        description: Filter expression, for example "last:5 location:'notes' (contains:'apple' or contains:'cat')
          is:md". `is:expiring` matches entries with a live expiring share that gave the caller access or that the caller
          manages; `is:self-destruct` matches files whose self-destruct timer is running.
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/ContentsLimit'
      responses:
        '200':
          description: Visible entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 2.0.0
    post:
      tags:
      - Entries
      operationId: createFolder
      description: Creates a folder in `parent_id` or `parent_path`, or at the top of a drive when neither is given.
        `drive` names the drive for `parent_path` or the top (its owner's `c:`/`si:` id or uuid; the caller's own by
        default) and is refused with `parent_id`. Only the drive's owner, and the custodian of a Silicon that owns
        it, may add at the top; inside a folder `write` is needed. `apps` at the top of a drive is kept for apps (422
        `reserved_name`). There is no Public space and there are no tags any more, so `root_type` other than
        `private` is 422 `public_space_retired` or `tags_retired`, and `tag` is `tags_retired`. `invitees` follow the
        sharing rules of `POST /entries/{entry_id}/invitations`. Sibling name collisions return 409 without exposing
        hidden entry metadata.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderCreate'
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 2.0.0
  /entries/{entry_id}:
    parameters:
    - $ref: '#/components/parameters/EntryId'
    get:
      tags:
      - Entries
      operationId: getEntry
      responses:
        '200':
          description: Entry metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
    patch:
      tags:
      - Entries
      operationId: updateEntry
      description: Renames an entry and/or moves it to another folder of the same drive. Entries move only within the
        drive that holds them; a destination folder the caller can see in another drive is 422 `cross_drive_move`
        (download and upload instead), and one it cannot see answers 404.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                parent_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.1.0
    delete:
      tags:
      - Entries
      operationId: moveEntryToBin
      description: The entry's creator, the drive's owner, and the custodian of either may move an entry to the bin.
        Delete is never shared.
      responses:
        '204':
          description: Entry moved to the 45-day bin
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /entries/{entry_id}/content:
    get:
      tags:
      - Entries
      operationId: readEntryContent
      summary: Stream current file bytes for sandboxed in-place rendering
      description: 'Briefcase relays the bytes itself, so the response is always bound to a current verified account
        and is never cacheable. Responses are sandboxed by Content-Security-Policy and served with `X-Content-Type-Options:
        nosniff`. Byte ranges are supported for media playback.'
      parameters:
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/Range'
      responses:
        '200':
          $ref: '#/components/responses/FileContent'
        '206':
          $ref: '#/components/responses/PartialFileContent'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /entries/{entry_id}/download:
    get:
      tags:
      - Entries
      operationId: downloadEntry
      summary: Download current file bytes as an attachment
      parameters:
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/Range'
      responses:
        '200':
          $ref: '#/components/responses/FileContent'
        '206':
          $ref: '#/components/responses/PartialFileContent'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
      description: Streams file bytes or a tar.zst folder archive. Folder archives include only entries the caller
        may read. No whole archive is buffered. Range requests apply to files only.
  /uploads:
    post:
      tags:
      - Uploads
      operationId: uploadFile
      summary: Upload a file of any supported size
      description: 'One request carries the whole file. Briefcase stages the bytes, then decides internally whether
        they fit a single provider request or need a multipart transfer, so a client never drives parts. Files up
        to 5 TiB are accepted; operators size the upload deadline and temporary disk for the sizes they expect.


        The destination folder is named either by `parent_id` or by `path`, never both; with neither, the file goes
        at the top of the drive. A path is resolved within the drive `drive` names (its owner''s `c:`/`si:` id or
        uuid; the caller''s own by default), so `reports/q3` addresses the same folder its permanent URL shows.
        `drive` is refused with `parent_id`, because a folder names its drive.


        Uploading a name that an active file already carries is how a file is updated: the bytes become that file''s
        next version, the response is that same entry, and its history keeps the previous complete version history.
        Creating a file needs `write` on the folder; replacing one needs `update` on the file. A folder with the
        same name is a conflict.


        Two limits apply to the drive the file lands in, whoever uploads it: 100 GiB of uploads per UTC day, and 1
        PiB of storage. The daily figure counts uploaded bytes and returns at midnight UTC; the storage figure counts
        what is currently kept, so deleting content returns capacity once the bytes are gone. Either limit may be
        configured per drive. An upload that does not fit is refused before its bytes are stored, and `GET /usage`
        reports both.


        `self_destruct_minutes` makes a new file self-destruct: 1 to 43,200 minutes (30 days) after the upload
        finishes, the file is permanently deleted. It never goes to the bin, and deleting it by hand before then is
        permanent too. It can only be chosen when the upload creates a file; naming an existing file is refused with
        `self_destruct_requires_new_file`, and a later version never changes the timer. The creator, the drive''s
        owner, and the custodian of either can keep the file with `DELETE /entries/{entry_id}/self-destruct`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                parent_id:
                  type: string
                  format: uuid
                  description: Destination folder identifier
                path:
                  type: string
                  maxLength: 2048
                  description: Destination folder path within the drive, as an alternative to parent_id
                drive:
                  type: string
                  maxLength: 80
                  description: The drive for path or for the top of a drive (its owner's `c:`/`si:` id or uuid); refused
                    with parent_id
                self_destruct_minutes:
                  $ref: '#/components/schemas/LifetimeMinutes'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File created, or a new version published on the existing file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '413':
          description: The file exceeds the 5 TiB maximum
        '429':
          description: The drive's daily upload allowance is spent; Retry-After gives the seconds until it resets
            at 00:00 UTC
        '507':
          description: The drive has no storage capacity left
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.1.0
  /entries/{entry_id}/permissions:
    parameters:
    - $ref: '#/components/parameters/EntryId'
    get:
      tags:
      - Permissions
      operationId: listPermissions
      responses:
        '200':
          description: Explicit permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionGrant'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
    post:
      tags:
      - Permissions
      operationId: grantPermission
      description: Anyone signed in to Briefcase can share with a Carbon. A Silicon accepts shares only from its custodian,
        the other Silicons its custodian looks after, and accounts it or its custodian allowed with `PUT
        /silicons/{silicon}/allowed-accounts/{account}`; anyone else is refused with 403 `silicon_not_open`. Only
        the entry's creator, the drive's owner, and the custodian of either may share. The recipient is named by
        `c:`/`si:` id (resolved at Silicon Accounts; 422 `unknown_account` or `account_inactive` otherwise), stored
        by uuid, and gets a notification in its inbox (and an email when it shared its email with Briefcase).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGrantCreate'
      responses:
        '201':
          description: Permission granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionGrant'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.1.0
  /entries/{entry_id}/permissions/{grant_id}:
    delete:
      tags:
      - Permissions
      operationId: revokePermission
      parameters:
      - $ref: '#/components/parameters/EntryId'
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Grant revoked
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /permissions/effective:
    post:
      tags:
      - Permissions
      operationId: inspectEffectivePermissions
      summary: Report what the caller may do on named files and folders
      description: Names up to 100 targets by identifier, path, or both. Identifiers may name entries in any drive;
        each is answered inside its own drive. Paths are resolved within `drive` (its owner's `c:`/`si:` id or uuid;
        the caller's own by default). A target that does not exist and one the caller cannot read are both reported
        as unresolved, so the answer never confirms a hidden entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionInspection'
      responses:
        '200':
          description: Effective access per readable target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionInspectionResult'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.1.0
  /search:
    get:
      tags:
      - Search
      operationId: searchFiles
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
      responses:
        '200':
          description: Permission-filtered results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
        default:
          $ref: '#/components/responses/Error'
      x-operation-version: 1.0.0
  /telemetry:
    post:
      tags: [Telemetry]
      operationId: submitTelemetry
      x-operation-version: 1.0.0
      summary: Submit a bounded operational event
      security: []
      description: Best-effort anonymous relay to Space Station. No table key or credential is required. Events are marked client_reported and never confer authority. At most 100 events per second per process; duplicate IDs are suppressed for 60 seconds. A 204 acknowledges intake, not remote persistence. A disabled or unconfigured collector discards events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, source, operation, stage]
              properties:
                id: {type: string, format: uuid, description: Non-nil event ID retained across retries.}
                source: {type: string, enum: [sdk, cli, daemon, web]}
                operation: {type: string, minLength: 1, maxLength: 96, pattern: '^[A-Za-z0-9_.-]+$', description: Fixed operational name; never credentials or user content. Known credential prefixes are rejected.}
                stage: {type: string, enum: [started, progress, completed, failed, cancelled]}
                testing: {type: boolean, default: false}
                environment_id: {type: [string, 'null'], format: uuid, description: Non-nil public ID; only valid when testing is true.}
                request_id: {type: [string, 'null'], format: uuid}
                duration_ms: {type: [integer, 'null'], minimum: 0}
                status: {type: [integer, 'null'], minimum: 100, maximum: 599}
                attempt: {type: [integer, 'null'], minimum: 0, maximum: 4294967295}
                count: {type: [integer, 'null'], minimum: 0}
                progress: {type: [integer, 'null'], minimum: 0, maximum: 100}
      responses:
        '204': {description: Event accepted for best-effort delivery or collection disabled}
        '429': {description: Process-wide telemetry intake limit reached}
        default:
          $ref: '#/components/responses/Error'
  /reports:
    post:
      tags: [Reports]
      operationId: submitReport
      x-operation-version: 1.0.0
      summary: Submit a bug report with an optional proposed fix
      description: Stores the user-authored report in the selected organization and environment. No telemetry, credentials, or files are collected automatically. Test reports stay in the test database. Reuse the same idempotency key and body after an uncertain response.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 16384
                  description: Nonblank reproduction steps; maximum 16384 UTF-8 bytes.
                pr:
                  type: string
                  format: uri
                  description: Optional HTTPS pull request URL in teamofsilicons/silicon-briefcase.
                isi:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Optional internal Silicon attribution; maximum 256 UTF-8 bytes, no control characters.
      responses:
        '200':
          description: Durable report receipt, including on an idempotent replay
          content:
            application/json:
              schema:
                type: object
                required: [id, accepted]
                properties:
                  id: {type: string, format: uuid}
                  accepted: {type: boolean, const: true}
        default:
          $ref: '#/components/responses/Error'
  /notifications:
    get:
      tags:
      - Notifications
      operationId: listNotifications
      summary: Read the central notification inbox
      description: Returns the twenty newest notifications for the authenticated Carbon or Silicon together with
        the unread count used for the badge. The inbox is the account's own; each subject names the drive that holds
        its entry, usually someone else's.
      responses:
        '200':
          description: Newest notifications and unread badge count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationInbox'

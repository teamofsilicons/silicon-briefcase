name: Build native Honeycomb package
on:
  workflow_dispatch:
    inputs:
      honeycomb_revision:
        description: Exact Honeycomb source revision used to validate and pack
        required: true
        type: string
        default: b39b1ceb96997ec4c80cb5c5354130ecb9da73eb
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            executable: briefcase
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            executable: briefcase
          - runner: windows-2025
            target: windows-x86_64
            triple: x86_64-pc-windows-msvc
            executable: briefcase.exe
          - runner: windows-11-arm
            target: windows-aarch64
            triple: aarch64-pc-windows-msvc
            executable: briefcase.exe
          - runner: macos-15-intel
            target: macos-x86_64
            triple: x86_64-apple-darwin
            executable: briefcase
          - runner: macos-15
            target: macos-aarch64
            triple: aarch64-apple-darwin
            executable: briefcase
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install pinned Linux baseline toolchain
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install 'cargo-zigbuild==0.23.4' 'ziglang==0.15.2'
          python3 -c 'from pathlib import Path; import ziglang; print("CARGO_ZIGBUILD_ZIG_PATH=" + str(Path(ziglang.__file__).with_name("zig")))' >> "$GITHUB_ENV"
          cargo-zigbuild --version
          python3 -m ziglang version
      - name: Build Linux CLI for glibc 2.28
        if: runner.os == 'Linux'
        run: cargo zigbuild --manifest-path clients/rust/Cargo.toml --locked --release -p briefcase-cli --features honeycomb-managed --target ${{ matrix.triple }}.2.28
      - name: Build native CLI
        if: runner.os != 'Linux'
        run: cargo build --manifest-path clients/rust/Cargo.toml --locked --release -p briefcase-cli --features honeycomb-managed --target ${{ matrix.triple }}
      - name: Verify Linux ABI requirements
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_linux_abi.py
          python3 scripts/check_linux_abi.py clients/rust/target/${{ matrix.triple }}/release/briefcase
      - name: Smoke test Linux executable on glibc 2.28
        if: runner.os == 'Linux'
        env:
          BRIEFCASE_RELEASE_BINARY: clients/rust/target/${{ matrix.triple }}/release/briefcase
        run: |
          docker run --rm --network none \
            --volume "$PWD/$BRIEFCASE_RELEASE_BINARY:/usr/local/bin/briefcase:ro" \
            --env SILICON_HOME=/tmp/briefcase-smoke --env BRIEFCASE_TELEMETRY=off \
            debian:buster-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc sh -eu -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              briefcase --version
              briefcase --help
              briefcase daemon status
            '
      - name: Smoke test native executable
        shell: bash
        env:
          BRIEFCASE_RELEASE_BINARY: clients/rust/target/${{ matrix.triple }}/release/${{ matrix.executable }}
        run: |
          "$BRIEFCASE_RELEASE_BINARY" --version
          "$BRIEFCASE_RELEASE_BINARY" --help
          "$BRIEFCASE_RELEASE_BINARY" daemon status
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: clients/rust/target/${{ matrix.triple }}/release/${{ matrix.executable }}
          if-no-files-found: error
  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Install reviewed Honeycomb packager
        env:
          HONEYCOMB_PACKAGER_REVISION: ${{ inputs.honeycomb_revision }}
        run: cargo install --locked --git https://github.com/teamofsilicons/silicon-honeycomb --rev "$HONEYCOMB_PACKAGER_REVISION" silicon-honeycomb-cli
      - run: python3 scripts/test_linux_abi.py
      - run: python3 scripts/package-native-session-release.py --binaries-dir artifacts --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: briefcase-honeycomb-package
          path: dist/*
          if-no-files-found: error

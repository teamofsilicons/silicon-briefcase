name: Build validated Honeycomb release

on:
  workflow_dispatch:
  push:
    branches: [release/public-identifiers-20260923]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            binary: briefcase
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            binary: briefcase
          - runner: windows-2025
            target: windows-x86_64
            triple: x86_64-pc-windows-msvc
            binary: briefcase.exe
          - runner: windows-11-arm
            target: windows-aarch64
            triple: aarch64-pc-windows-msvc
            binary: briefcase.exe
          - runner: macos-15-intel
            target: macos-x86_64
            triple: x86_64-apple-darwin
            binary: briefcase
          - runner: macos-15
            target: macos-aarch64
            triple: aarch64-apple-darwin
            binary: briefcase
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: clients/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: python ../../scripts/sync-cli-docs.py --check
      - run: cargo test --locked -p briefcase-cli --features honeycomb-managed --target ${{ matrix.triple }}
      - run: cargo build --release --locked -p briefcase-cli --features honeycomb-managed --target ${{ matrix.triple }}
      - run: ./target/${{ matrix.triple }}/release/${{ matrix.binary }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: clients/rust/target/${{ matrix.triple }}/release/${{ matrix.binary }}
          if-no-files-found: error

  package:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-binaries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Install the pinned Honeycomb packager
        run: cargo install --locked --git https://github.com/teamofsilicons/silicon-honeycomb --rev b39b1ceb96997ec4c80cb5c5354130ecb9da73eb silicon-honeycomb-cli
      - name: Check release tag against the CLI version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('clients/rust/Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match the CLI version'
          PY
      - run: python scripts/package-release.py --binaries-dir release-binaries
      - uses: actions/upload-artifact@v4
        with:
          name: briefcase-honeycomb-release
          path: dist/*
          if-no-files-found: error

# This workflow produces reviewable artifacts; it does not publish a release.

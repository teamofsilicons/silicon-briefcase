name: Build validated Silicon Apps release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            binary: briefcase
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            binary: briefcase
          - runner: windows-2025
            target: windows-x86_64
            triple: x86_64-pc-windows-msvc
            binary: briefcase.exe
          - runner: windows-11-arm
            target: windows-aarch64
            triple: aarch64-pc-windows-msvc
            binary: briefcase.exe
          - runner: macos-15-intel
            target: macos-x86_64
            triple: x86_64-apple-darwin
            binary: briefcase
          - runner: macos-15
            target: macos-aarch64
            triple: aarch64-apple-darwin
            binary: briefcase
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: clients/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: python ../../scripts/sync-cli-docs.py --check
      - run: cargo test --locked -p briefcase-cli --target ${{ matrix.triple }}
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install pinned Linux baseline toolchain
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install 'cargo-zigbuild==0.23.4' 'ziglang==0.15.2'
          python3 -c 'from pathlib import Path; import ziglang; print("CARGO_ZIGBUILD_ZIG_PATH=" + str(Path(ziglang.__file__).with_name("zig")))' >> "$GITHUB_ENV"
      - name: Build Linux CLI for glibc 2.28
        if: runner.os == 'Linux'
        run: cargo zigbuild --locked --release -p briefcase-cli --target ${{ matrix.triple }}.2.28
      - name: Build native CLI
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p briefcase-cli --target ${{ matrix.triple }}
      - name: Verify Linux ABI
        if: runner.os == 'Linux'
        run: |
          python3 ../../scripts/test_linux_abi.py
          python3 ../../scripts/check_linux_abi.py target/${{ matrix.triple }}/release/briefcase
      - name: Smoke test glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none \
            --volume "$PWD/target/${{ matrix.triple }}/release/briefcase:/usr/local/bin/briefcase:ro" \
            --env SILICON_HOME=/tmp/briefcase-smoke --env BRIEFCASE_TELEMETRY=off \
            debian:buster-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc sh -eu -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              briefcase --version
              briefcase --help
              briefcase accounts --json
              briefcase login status --json
            '
      - run: ./target/${{ matrix.triple }}/release/${{ matrix.binary }} --version
      - name: Install the pinned Silicon Apps packager
        run: cargo install --locked silicon-apps-cli@0.2.0
      - name: Validate and pack this native target
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo "Tag must match v$VERSION" >&2; exit 1; fi
          python ../../scripts/package-apps.py "$VERSION" ${{ matrix.target }} target/${{ matrix.triple }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: briefcase-silicon-apps-${{ matrix.target }}
          path: dist/apps/*
          if-no-files-found: error

  collect:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: briefcase-silicon-apps-*
          merge-multiple: true
          path: dist/apps
      - run: cd dist/apps && cat *.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: briefcase-silicon-apps-release
          path: dist/apps/*
          if-no-files-found: error
# Artifacts only. Release upload and publication are separate operator actions.
